<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a5d43">

    <style>
        /* --- Reset & Core Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        /* --- Mobile Container (Agar terlihat seperti di screenshot) --- */
        .app-container {
            width: 100%;
            max-width: 420px; /* Simulasi lebar maksimal HP */
            background-color: #fff;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* --- Header Hijau --- */
        .header-section {
            background: linear-gradient(135deg, #0a5d43 0%, #157351 100%);
            padding: 20px 20px 60px 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Watermark Pattern 'bsn' */
        .header-section::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="25" viewBox="0 0 50 25"><text x="10" y="15" fill="white" font-family="Arial" font-size="10" opacity="0.08">bsn</text></svg>');
            background-repeat: repeat;
            opacity: 0.6;
        }

        /* Tombol Kembali */
        .back-nav {
            align-self: flex-start;
            z-index: 2;
            margin-bottom: 30px;
        }

        .back-button {
            width: 35px;
            height: 35px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            color: #0f664a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Area Logo */
        .logo-area {
            text-align: center;
            color: #fff;
            z-index: 1;
            margin-bottom: 20px;
        }

        .logo-main {
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        /* Bintang di logo */
        .logo-main::after {
            content: "✦";
            position: absolute;
            top: -12px;
            right: -15px;
            color: #a4f2b1;
            font-size: 22px;
        }

        .logo-sub {
            font-size: 24px;
            font-weight: 300;
            margin-top: -5px;
        }

        .powered-text {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* --- Form Container (Panel Putih Melengkung) --- */
        .form-section {
            background-color: #fff;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: -30px; /* Tumpang tindih dengan header */
            padding: 35px 25px;
            flex-grow: 1;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        /* --- Gaya Input & Label --- */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .main-label {
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }

        .helper-link {
            font-size: 11px;
            color: #666;
            text-decoration: none;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            background-color: #fff;
            color: #333;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #157351;
        }

        .form-input::placeholder {
            color: #ccc;
        }

        /* Input kata sandi (ada ikon mata) */
        .form-input.password-input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 25px;
            height: 25px;
        }

        /* --- Tombol Aksi --- */
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        /* Tombol Masuk */
        .btn-masuk {
            flex-grow: 1;
            background-color: #0f664a;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-masuk:active {
            background-color: #0a4d38;
        }

        /* Tombol Sidik Jari */
        .btn-biometric {
            width: 50px;
            height: 50px;
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #157351;
        }

        /* --- Footer Form --- */
        .register-ref {
            text-align: center;
            font-size: 13px;
            color: #555;
            margin-bottom: auto; /* Mendorong copyright ke bawah */
            padding-bottom: 30px;
        }

        .register-link {
            color: #157351;
            text-decoration: none;
            font-weight: 600;
        }

        .copyright {
            text-align: center;
            font-size: 10px;
            color: #bbb;
            padding-bottom: 10px;
        }

        /* --- Home Indicator (iOS style) --- */
        .home-indicator {
            width: 135px;
            height: 5px;
            background-color: #333;
            border-radius: 3px;
            margin: 0 auto 8px auto;
            opacity: 0.8;
        }

        /* Ikon SVG sederhana (Pengganti FontAwesome agar 1 file) */
        .icon-svg {
            width: 1em; height: 1em; fill: currentColor;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Bagian Atas Hijau -->
        <div class="header-section">
            <div class="back-nav">
                <button class="back-button" onclick="alert('Kembali')">
                    <!-- SVG Ikon Panah Kiri -->
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20,11V13H8l5.5,5.5l-1.42,1.42L4.16,12l7.92-7.92L13.5,5.5L8,11H20Z"></path></svg>
                </button>
            </div>
            
            <div class="logo-area">
                <div class="logo-wrapper">
                    <span class="logo-main">ITORA</span>
                </div>
                <div class="logo-sub">BSN Surabaya</div>
                <div class="powered-text">by bsn</div>
            </div>
        </div>

        <!-- Bagian Form Putih -->
        <div class="form-section">
            
            <!-- Input ID Pengguna -->
            <div class="input-group">
                <div class="label-row">
                    <label for="userId" class="main-label">ID Pengguna :</label>
                    <a href="#" class="helper-link">Lupa ID Pengguna ?</a>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="userId" class="form-input" placeholder="Masukan ID Pengguna">
                </div>
            </div>

            <!-- Input Kata Sandi -->
            <div class="input-group">
                <div class="label-row">
                    <label for="password" class="main-label">Kata Sandi :</label>
                    <a href="#" class="helper-link">Lupa Kata Sandi ?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input password-input" placeholder="Masukan Kata Sandi">
                    <!-- Ikon Mata untuk Toggle -->
                    <div class="toggle-password" id="togglePassword">
                        <!-- SVG Ikon Mata -->
                        <svg class="icon-svg" id="eyeIcon" viewBox="0 0 24 24"><path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="action-row">
                <button class="btn-masuk">Masuk</button>
                <button class="btn-biometric" onclick="alert('Aktifkan Sidik Jari')">
                    <!-- SVG Ikon Sidik Jari -->
                    <svg class="icon-svg" style="font-size: 28px;" viewBox="0 0 24 24"><path d="M17.81,4.47L17.73,4.46C17.22,4.3 16.7,4.21 16.18,4.17C14.83,4.09 13.49,4.22 12.16,4.56C10.59,4.96 9.09,5.67 7.78,6.66C6.18,7.86 4.97,9.45 4.31,11.3C4.19,11.63 4.22,12 4.39,12.3C4.57,12.59 4.88,12.78 5.22,12.78C5.35,12.78 5.47,12.75 5.58,12.71C6.2,12.45 6.5,11.75 6.24,11.13C6.73,9.75 7.64,8.55 8.84,7.65C9.84,6.9 10.97,6.36 12.17,6.06C13.29,5.78 14.44,5.67 15.6,5.75C16.03,5.78 16.46,5.85 16.89,5.97L17.06,6.03C17.65,6.23 18.29,5.92 18.5,5.33C18.7,4.74 18.4,4.1 17.81,4.47M20.39,11.69C20.06,11.37 19.55,11.32 19.16,11.55C18.66,11.85 18.13,12.09 17.58,12.26C16.89,12.47 16.18,12.58 15.47,12.58C14.86,12.58 14.25,12.5 13.66,12.33L13.56,12.31C13.25,12.22 12.92,12.23 12.63,12.35C12.33,12.47 12.1,12.7 11.96,12.99C11.82,13.28 11.8,13.6 11.9,13.9C12,14.2 12.2,14.44 12.47,14.59C13.31,15 14.24,15.23 15.19,15.28L15.46,15.29L15.73,15.28C16.71,15.26 17.69,15.02 18.61,14.58C19.25,14.27 19.85,13.88 20.4,13.43C20.84,13.06 20.89,12.4 20.52,11.96C20.48,11.91 20.44,11.87 20.39,11.69M16.63,18.41C16.14,18.81 15.6,19.14 15.03,19.38C13.78,19.9 12.43,20.06 11.1,19.86C9.92,19.68 8.79,19.22 7.78,18.52C6.98,17.96 6.27,17.27 5.67,16.48C5.11,15.76 4.7,14.95 4.47,14.09C4.38,13.77 4.41,13.43 4.56,13.13C4.72,12.83 4.97,12.6 5.29,12.49C5.61,12.38 5.95,12.39 6.26,12.53C6.56,12.66 6.81,12.89 6.95,13.19C7.11,13.8 7.39,14.37 7.78,14.88C8.21,15.44 8.7,15.93 9.27,16.32C10,16.8 10.8,17.13 11.64,17.28C12.59,17.46 13.56,17.37 14.47,17.02C14.88,16.86 15.27,16.64 15.63,16.37C16.14,15.97 16.87,16.05 17.27,16.56C17.67,17.07 17.59,17.8 17.08,18.2C17.03,18.24 16.98,18.28 16.63,18.41M13.41,8.09C12.39,7.88 11.36,7.91 10.36,8.19C9.28,8.5 8.28,9.07 7.42,9.85C6.7,10.5 6.13,11.29 5.75,12.18C5.37,13.06 5.17,14 5.16,14.96C5.16,15.66 5.25,16.36 5.43,17.04C5.58,17.64 5.22,18.26 4.62,18.41C4.02,18.56 3.4,18.2 3.25,17.6C3.02,16.73 2.91,15.85 2.91,14.96C2.92,13.73 3.18,12.51 3.67,11.39C4.16,10.25 4.88,9.24 5.8,8.4C6.9,7.4 8.18,6.67 9.57,6.27C10.86,5.9 12.19,5.84 13.51,6.09C13.84,6.15 14.13,6.33 14.32,6.6C14.52,6.86 14.6,7.19 14.55,7.52C14.5,7.84 14.32,8.13 14.06,8.32C13.8,8.52 13.47,8.6 13.14,8.55L13.41,8.09M21.09,14.16C20.67,15.5 19.98,16.74 19.04,17.79C17.96,19 16.6,19.92 15.08,20.47C14.16,20.81 13.19,21 12.21,21.03L12.07,21.04C11.16,21.04 10.25,20.91 9.38,20.65C8.78,20.48 8.44,19.85 8.61,19.25C8.78,18.65 9.41,18.31 10.01,18.48C10.73,18.69 11.47,18.79 12.22,18.79L12.36,18.78C13.16,18.76 13.95,18.6 14.69,18.33C15.93,17.88 17.04,17.13 17.92,16.14C18.68,15.29 19.25,14.28 19.59,13.19C19.78,12.59 20.41,12.27 21,12.46C21.6,12.65 21.92,13.28 21.73,13.88C21.73,13.88 21.73,13.89 21.09,14.16Z"></path></svg>
                </button>
            </div>

            <!-- Teks Pendaftaran -->
            <div class="register-ref">
                Belum Punya Akun ? <a href="#" class="register-link" onclick="alert('Menuju Halaman Daftar')">Daftar Disini</a>
            </div>

            <!-- Copyright -->
            <div class="copyright">
                © 2025 Bank Syariah Nasional. All rights reserved.
            </div>

            <!-- iOS Home Indicator -->
            <div class="home-indicator"></div>
        </div>
    </div>

    <!-- JavaScript Sederhana untuk Toggle Mata Kata Sandi -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        // SVG untuk mata tertutup (dipakai saat password disembunyikan)
        const eyeOnPath = "M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z";
        // SVG untuk mata terbuka (dipakai saat password ditampilkan)
        const eyeOffPath = "M11.83,9L15,12.17C14.83,12.63 14.46,13 14,13.17L11.83,11M12,17A5,5 0 0,1 7,12C7,11.54 7.37,11.17 7.83,11L12,15.17V17M12,4.5C7,4.5 2.73,7.61 1,12C2,14.17 3.54,16.1 5.46,17.46L7.43,15.49C6.54,14.54 6,13.33 6,12A6,6 0 0,1 12,6C13.33,6 14.54,6.54 15.49,7.43L17.46,5.46C16.1,3.54 14.17,2 12,2M12,4.5M2,4.27L3.27,3L21,20.73L19.73,22L17.27,19.54C15.71,20.76 13.91,21.5 12,21.5C7,21.5 2.73,18.39 1,14C1.5,12.83 2.15,11.72 3,10.73L2,9.73V4.27Z";

        togglePassword.addEventListener('click', function () {
            // Cek tipe input saat ini
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Ganti ikon mata berdasarkan tipe
            if (type === 'text') {
                eyeIcon.innerHTML = `<path d="${eyeOffPath}"></path>`;
            } else {
                eyeIcon.innerHTML = `<path d="${eyeOnPath}"></path>`;
            }
        });
    </script>
</body>
</html>
