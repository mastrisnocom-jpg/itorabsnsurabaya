<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bale Syariah Login - Menu Mockup</title>
    <style>
        /* --- Aturan Dasar & Font --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* Font modern sans-serif */
        }

        /* Mewarnai latar belakang luar agar ponsel menonjol */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            padding: 20px;
        }

        /* --- Kontainer Layar Seluler --- */
        .mobile-screen {
            width: 375px; /* Lebar iPhone standar */
            height: 812px; /* Tinggi iPhone standar */
            background-color: #fff;
            border: 4px solid #ccc;
            border-radius: 40px;
            overflow: hidden; /* Memastikan sudut membulat pada semua elemen anak */
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* --- Bagian Atas Hijau --- */
        .green-header {
            /* Gradien hijau gelap ke terang */
            background: linear-gradient(135deg, #0a5d43 0%, #157351 100%);
            padding: 20px 25px 80px; /* Padding bawah yang besar untuk panel putih tumpang tindih */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pola tanda air 'bsn' */
        .bsn-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* PNG transparan pola 'bsn' yang disematkan secara inline */
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4RrDAAAABlBMVEUAAAD///+l2Z/dAAAAAnRSTlMAAHaTzTgAAAA4SURBVHgB7crBCQAwDMCw8X//3M4VCHl7XjC7H5YI/4b/hv+G/4b/hv+G/4b/hv+G/4b/hv9G3R8D8wYf/AAAAABJRU5ErkJggg==');
            opacity: 0.1; /* Tampilan pola yang sangat halus */
            background-repeat: repeat;
            background-size: 50px;

        /* Tombol Kembali Lingkaran */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 36px;
            height: 36px;
            background-color: #fff;
            border: none;
            border-radius: 50%;
            color: #0f664a;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2; /* Di atas pola bsn */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Grup Logo */
        .logo-container {
            text-align: center;
            color: #fff;
            margin-top: 60px;
            z-index: 1; /* Di atas pola bsn */
        }

        .logo {
            font-size: 40px;
            font-weight: bold;
            line-height: 1;
            position: relative;
        }

        /* Bintang hijau di logo 'e' */
        .logo span {
            position: absolute;
            top: -15px;
            right: -10px;
            color: #a4f2b1; /* Hijau terang untuk bintang */
            font-size: 24px;
        }

        .subtitle {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .powered-by {
            font-size: 10px;
            opacity: 0.8;
        }

        /* --- Panel Formulir Putih --- */
        .white-form {
            flex-grow: 1;
            background-color: #fff;
            border-top-left-radius: 35px; /* Sudut membulat atas yang besar */
            border-top-right-radius: 35px;
            margin-top: -35px; /* Tumpang tindih dengan header hijau */
            padding: 40px 25px 20px;
            z-index: 2; /* Di atas header hijau */
            display: flex;
            flex-direction: column;
        }

        /* Tata letak formulir */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        /* Baris Label di atas Input */
        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .label-row label {
            font-size: 13px;
            color: #444;
            font-weight: bold;
        }

        /* Tautan Lupa Abu-abu */
        .forgot-link {
            font-size: 11px;
            color: #666;
            text-decoration: none;
        }

        /* Gaya Kotak Input */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
        }

        input::placeholder {
            color: #aaa;
        }

        /* Pembungkus Kata Sandi untuk Ikon Mata */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px; /* Beri ruang untuk ikon mata */
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            cursor: pointer;
        }

        /* Grup Tombol Tindakan */
        .action-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;

            font-weight: bold;
            cursor: pointer;
