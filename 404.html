<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - Halaman Tidak Ditemukan | ITORA BSN SURABAYA</title>
  
  <meta name="theme-color" content="#00875A">

  <!-- FONTAWESOME & GOOGLE FONTS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --primary: #00875A;
      --primary-dark: #005E3E;
      --accent-gold: #D4AF37;
      --bg-dark: #F8FAFC;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: rgba(226, 232, 240, 0.9);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .error-card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .error-icon-box {
      width: 80px;
      height: 80px;
      background: #FEF2F2;
      color: #EF4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 20px;
    }

    .error-card h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .error-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .error-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .footer-brand {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .footer-brand span {
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-icon-box">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1>404</h1>
    <h2>Halaman Tidak Ditemukan</h2>
    <p>Maaf, tautan yang Anda akses atau alamat halaman yang dituju tidak tersedia atau telah dipindahkan.</p>
    
    <a href="/" class="btn btn-primary">
      <i class="fa-solid fa-house"></i> Kembali ke Beranda Utama
    </a>

    <div class="footer-brand">
      ITORA BSN <span>SURABAYA CLUB</span>
    </div>
  </div>

</body>
</html>
